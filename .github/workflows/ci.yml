name: CI Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore CRMAsyncHealthChecker.sln
    
    - name: Build
      run: dotnet build CRMAsyncHealthChecker.sln --configuration Release --no-restore
    
    - name: Test
      run: dotnet test CRMAsyncHealthChecker.sln --configuration Release --no-build --verbosity normal
